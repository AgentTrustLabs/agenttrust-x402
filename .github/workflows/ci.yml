# CI — AgentTrust x402
#
# Minimal quality gate: install, typecheck, build, test — in order, no
# failure is hidden (no continue-on-error anywhere). Runs on every push and
# on pull requests toward main. No secrets, no wallets, no signing, no
# settlement, no broadcast, no Testnet access.
#
# Known status (2026-11-10, local run on the authorization-owner branch):
# typecheck + build pass (root and services/facilitator). The full suite had
# 5 failures, all addressed in the working copy (see the "Set up test users"
# step below, src/audit/lock.ts, and test/packaging-metadata.test.mts).
# CI run #1 (42839620365) still failed with the same 5 because the fixes
# were not on the branch yet — only this workflow file was — and because
# the test users had no home directory (see the setup step). This version
# of the workflow fixes the environment part; the code fixes travel with
# the next push of the four changed files.
#  - test/ipc-protocol.test.mts, test/process-boundary.test.mts,
#    test/transaction-crash.test.mts: need OS users authowner, ubuntu,
#    authzintruder and authsigner (group authclients), run via sudo. The setup step creates
#    them with a home directory and makes the checkout readable; UID 1001
#    is taken by the `runner` user on GitHub-hosted runners, so `ubuntu`
#    gets a free UID and the tests read it via TEST_FACILITATOR_UID
#    (default 1001).
#  - Six suites used to SKIP in CI and were still counted PASS by the old
#    runner: owner-storage-isolation (needs root), ipc-context,
#    ipc-recovery, ipc-signing, response-loss, separate-process-signing
#    (need the facilitator UID + authclients group). test/run.mjs now
#    invokes them under the right identity (sudo / sudo -u ubuntu), the
#    gates resolve the UID/GID at runtime instead of hardcoding 1001/1002,
#    a skip exits 3 and fails the run, and ubuntu gets a passwordless
#    sudoers entry so its own setup chowns and Owner spawns work.
#  - test/lock-hardening.test.mts E1: torn-write race in the audit lock —
#    a contender could read the lock file while its creator was still
#    writing it and fail as unrecoverable. Fixed: pre-stringify before
#    create, retry briefly on malformed content, still fail closed.
#  - test/packaging-metadata.test.mts F4.3: the assertion expected pretest
#    to be exactly 'tsc'; the script is 'npm run build:peercred && tsc'.
#    The assertion now checks the intended contract (pretest runs tsc).
# See the run log before claiming green.

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The IPC suites (ipc-protocol, process-boundary, transaction-crash)
      # spawn real processes as OS users via `sudo -u`. A stock runner has
      # none of them, so create them here. This touches only the ephemeral
      # runner: no passwords, no login shells, and the users are test-only
      # (they never own production data). UID 1001 is taken by the `runner`
      # user on GitHub-hosted runners, so `ubuntu` gets the first free UID
      # and the tests read it via TEST_FACILITATOR_UID (their default is
      # 1001). `authowner`'s UID does not matter to the tests (only the name
      # is used), so it takes 997 when free, otherwise any free UID.
      # `authzintruder` must be a different UID from the facilitator and a
      # member of authclients. `authsigner` plays the signing-service role
      # in the owner-storage-isolation suite: the Owner and the facilitator
      # enforce distinct UIDs for the Owner, the facilitator and the
      # signing service, so the signing calls must come from a third UID
      # (they cannot share the facilitator's UID).
      #
      # Two environment facts the CI #1 run exposed (run 42839620365):
      #  - The users need a real home directory. Created with `-M` (no
      #    home), `npx` run as a test user fails with EACCES trying to
      #    create /home/<user> for its cache. So the users are created
      #    with `-m`.
      #  - The users must be able to READ the checkout: `npx` resolves tsx
      #    from ./node_modules/.bin, and when it cannot it falls back to
      #    fetching from the registry. So the workspace is made
      #    world-readable and every directory on the path to it is made
      #    traversable.
      # `sudo -u <user> npx` uses sudo's secure_path, which does not
      # include the setup-node tool cache, so node/npx are exposed under
      # /usr/local/bin.
      - name: Set up test users (IPC suites)
        run: |
          set -euo pipefail
          sudo groupadd -f authclients
          if ! id -u authowner >/dev/null 2>&1; then
            if ! getent passwd 997 >/dev/null 2>&1; then sudo useradd -m -s /usr/sbin/nologin -u 997 authowner;
            else sudo useradd -m -s /usr/sbin/nologin authowner; fi
          fi
          if ! id -u ubuntu >/dev/null 2>&1; then
            if ! getent passwd 1001 >/dev/null 2>&1; then sudo useradd -m -s /usr/sbin/nologin -u 1001 ubuntu;
            else sudo useradd -m -s /usr/sbin/nologin ubuntu; fi
          fi
          if ! id -u authzintruder >/dev/null 2>&1; then
            sudo useradd -m -s /usr/sbin/nologin authzintruder
          fi
          if ! id -u authsigner >/dev/null 2>&1; then
            sudo useradd -m -s /usr/sbin/nologin authsigner
          fi
          sudo usermod -aG authclients ubuntu
          sudo usermod -aG authclients authzintruder
          sudo usermod -aG authclients authsigner
          # the Owner (authowner) must also be in authclients —
          # the owner-storage-isolation suite serves the Owner socket from a
          # group-gated directory and drives the facilitator side as ubuntu.
          sudo usermod -aG authclients authowner
          # The IPC suites run as ubuntu (test/run.mjs invokes them via
          # `sudo -u ubuntu`), and from there they must sudo back to root
          # (directory chown) and to authowner (Owner spawn). The runner's
          # own sudo does not transfer: a sudoers entry for ubuntu is what
          # makes those suites executable at all. Test-only users on an
          # ephemeral runner; never production data.
          echo 'ubuntu ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/ubuntu-test >/dev/null
          sudo chmod 440 /etc/sudoers.d/ubuntu-test
          sudo visudo -cf /etc/sudoers.d/ubuntu-test
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo ln -sf "$(command -v npx)" /usr/local/bin/npx
          # The test users must be able to read the checkout.
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"
          d="$GITHUB_WORKSPACE"
          while [ "$d" != "$HOME" ] && [ "$d" != "/" ]; do
            sudo chmod a+rx "$d"
            d="$(dirname "$d")"
          done
          sudo chmod a+rx "$HOME"
          echo "TEST_FACILITATOR_UID=$(id -u ubuntu)" >> "$GITHUB_ENV"
          id ubuntu; id authowner; id authzintruder; id authsigner; getent group authclients

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (root)
        run: npm run typecheck

      # The production signing launcher (scripts/sponsor-wallet-service.mts)
      # is NOT covered by the root tsconfig (src/**/*.ts only), which is how
      # it shipped without ownerAuthorization. tsconfig.launcher.json checks
      # it plus its focused regression test; this step makes that check part
      # of the gate. It runs from the repo root with the installed
      # dependencies and fails the job on any error (no continue-on-error).
      - name: Typecheck (launcher)
        run: npm run typecheck:launcher

      - name: Build (root)
        run: npm run build

      - name: Typecheck (facilitator)
        run: npm --prefix services/facilitator run typecheck

      - name: Build (facilitator)
        run: npm --prefix services/facilitator run build

      - name: Test
        run: npm test
