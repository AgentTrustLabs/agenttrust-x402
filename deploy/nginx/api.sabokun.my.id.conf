# AgentTrust x402 — reverse proxy for the public API.
#
#   https://api.sabokun.my.id/agenttrust/*  ->  http://127.0.0.1:4590/*
#
# The /agenttrust prefix is stripped before proxying, so the resource
# server sees the bare paths it serves (/protected, /api/services,
# /.well-known/agent-card.json). The resource server binds 127.0.0.1:4590
# only; port 4590 is never exposed publicly.
#
# This file is a server-block snippet: install it as
# /etc/nginx/sites-available/api.sabokun.my.id.conf (Debian/Ubuntu, plus
# a symlink in sites-enabled) or /etc/nginx/conf.d/api.sabokun.my.id.conf
# (RHEL). See deploy/nginx/README.md for prerequisites, TLS, install
# steps, and verification. Do not edit the installed copy on the host;
# edit the repo copy and re-install it.

# HTTP: serve the ACME challenge for certbot, redirect everything else to HTTPS.
server {
    listen 80;
    server_name api.sabokun.my.id;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot).
    # This must come before the redirect, or issuance/renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: the public API.
server {
    listen 443 ssl;
    server_name api.sabokun.my.id;

    ssl_certificate     /etc/letsencrypt/live/api.sabokun.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sabokun.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS for this host only (no includeSubDomains: other subdomains
    # may not be HTTPS yet).
    add_header Strict-Transport-Security "max-age=63072000" always;

    access_log /var/log/nginx/api.sabokun.my.id.access.log;
    error_log  /var/log/nginx/api.sabokun.my.id.error.log;

    # The API: strip /agenttrust and proxy to the resource server.
    # proxy_pass with a trailing slash replaces the matched location
    # prefix (/agenttrust/) with "/", so:
    #   /agenttrust/protected                    -> /protected
    #   /agenttrust/api/services                 -> /api/services
    #   /agenttrust/.well-known/agent-card.json  -> /.well-known/agent-card.json
    # Query strings are preserved. CORS headers are set entirely by the
    # resource server: this block neither adds nor strips any
    # Access-Control-* header.
    location /agenttrust/ {
        proxy_pass http://127.0.0.1:4590/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Nothing else is served on this host.
    location / {
        return 404;
    }
}
